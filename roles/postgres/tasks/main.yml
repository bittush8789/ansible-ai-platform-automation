---
# Tasks for postgres role - Deploy PostgreSQL Metadata Database

- name: Create MLOps namespace
  kubernetes.core.k8s:
    name: "{{ k8s_mlops_namespace }}"
    kind: Namespace
    state: present
  when: inventory_hostname in groups['k8s_master']

- name: Render PostgreSQL manifests
  template:
    src: postgres-manifests.yaml.j2
    dest: /tmp/postgres-manifests.yaml
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname in groups['k8s_master']

- name: Apply PostgreSQL Kubernetes manifests
  command: kubectl apply -f /tmp/postgres-manifests.yaml
  when: inventory_hostname in groups['k8s_master']

- name: Wait for PostgreSQL deployment to be ready
  shell: |
    kubectl rollout status deployment/postgres -n {{ k8s_mlops_namespace }} --timeout=120s
  changed_when: false
  when: inventory_hostname in groups['k8s_master']
